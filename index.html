<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองคิว LIFF</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h2 id="userName">กำลังโหลดข้อมูล...</h2>
    <div id="bookingForm" style="display:none;">
        <p>เลือกแพ็กเกจ:</p>
        <select id="package">
            <option value="ล้างรถเทพ">ล้างรถเทพ</option>
            <option value="เคลือบแก้ว">เคลือบแก้ว</option>
        </select>
        <p>เลือกเวลาจอง:</p>
        <input type="datetime-local" id="bookingTime">
        <br><br>
        <button onclick="reserve()">ยืนยันการจอง</button>
    </div>

    <script>
        async function main() {
            await liff.init({ liffId: "2009974431-rZ9Od5w1" });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById('userName').innerText = "สวัสดีคุณ " + profile.displayName;
                document.getElementById('bookingForm').style.display = "block";
                window.userId = profile.userId; // เก็บ ID ไว้ส่งไปหลังบ้าน
            }
        }
        main();

        async function reserve() {
            const pkg = document.getElementById('package').value;
            const time = document.getElementById('bookingTime').value;

            const res = await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: window.userId,
                    package: pkg,
                    time: time
                })
            });
            if (res.ok) alert('จองสำเร็จ! ระบบจะแจ้งเตือนเมื่อถึงเวลา');
        }
    </script>
</body>
</html>
